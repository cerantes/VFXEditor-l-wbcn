name: Create Release

on:
  push:
    tags-ignore:
      - testing_*

permissions:
  contents: write

jobs:
  npc-list:
    runs-on: ubuntu-latest
    env:
      # ResLogger2 export (https://rl2.perchbird.dev/Downloads)
      RESLOG_PATHLIST_URL: https://rl2.perchbird.dev/download/CurrentPathList.zip
      # BNpcBase -> BNpcName index
      BNPC_INDEX_URL: https://raw.githubusercontent.com/ffxiv-teamcraft/ffxiv-teamcraft/staging/libs/data/src/lib/json/gubal-bnpcs-index.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source files
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p reslog && cd reslog

          fetch() { # fetch <url> <output name> [file inside zip], unpacking .gz / .zip if needed
            curl -fsSL --retry 3 "$1" -o download.tmp
            if gzip -t download.tmp 2>/dev/null; then
              gunzip -c download.tmp > "$2"
            elif unzip -tq download.tmp >/dev/null 2>&1; then
              unzip -p download.tmp ${3:+"$3"} > "$2"
            else
              mv download.tmp "$2"
            fi
            rm -f download.tmp
          }

          fetch "$RESLOG_PATHLIST_URL" CurrentPathList CurrentPathList.txt
          test -s CurrentPathList
          echo "CurrentPathList: $(wc -l < CurrentPathList) paths"
          fetch "$BNPC_INDEX_URL" bnpc-download.json
      - name: Format bnpc.json
        working-directory: ${{ runner.temp }}/reslog
        run: |
          python - <<'PY'
          import json
          data = json.load(open("bnpc-download.json"))
          assert isinstance(data, dict) and len(data) > 10000, f"unexpected bnpc index ({len(data)} entries)"
          with open("bnpc.json", "w") as f:
              json.dump(data, f, indent=4)
          print(f"bnpc.json: {len(data)} entries")
          PY
      - name: Run reslog_process.py
        working-directory: ${{ runner.temp }}/reslog
        run: python "$GITHUB_WORKSPACE/scripts/reslog_process.py"
      - name: Upload npc data
        uses: actions/upload-artifact@v4
        with:
          name: npc-list
          path: |
            ${{ runner.temp }}/reslog/npc_files.json
            ${{ runner.temp }}/reslog/bnpc.json

  build:
    needs: npc-list
    # still release even if the npc list couldn't be generated
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
              10.x.x
              9.x.x
      - name: Download npc list
        if: ${{ needs.npc-list.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: npc-list
          path: npc-list
      - name: Update npc_files.json and bnpc.json
        if: ${{ needs.npc-list.result == 'success' }}
        run: |
          Copy-Item npc-list/npc_files.json VFXEditor/Files/npc_files.json -Force
          Copy-Item npc-list/bnpc.json VFXEditor/Files/bnpc.json -Force
      - name: Update orchestrion.csv
        # still release with the existing orchestrion.csv if the sheet can't be downloaded
        continue-on-error: true
        run: |
          $url = 'https://docs.google.com/spreadsheets/d/1s-xJjxqp6pwS7oewNy1aOQnr3gaJbewvIBbyYchZ6No/gviz/tq?tqx=out:csv&sheet=en'
          Invoke-WebRequest -Uri $url -OutFile data.csv -MaximumRetryCount 3
          $lines = Get-Content data.csv
          if ($lines[0] -notmatch '^"ID","Title"' -or $lines.Count -lt 1000) {
            throw "unexpected orchestrion sheet ($($lines.Count) lines, header: $($lines[0]))"
          }
          Copy-Item data.csv VFXEditor/Files/orchestrion.csv -Force
          Write-Host "orchestrion.csv: $($lines.Count) lines"
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud (CN)
        run: |
          $info = Invoke-RestMethod -Uri "https://aonyx.ffxiv.wang/Dalamud/Release/VersionInfo?track=stg"
          Write-Host "CN Dalamud: $($info.AssemblyVersion) (game $($info.SupportedGameVer))"
          Invoke-WebRequest -Uri $info.downloadUrl -OutFile dalamud.7z
          $cnPath = "$env:AppData\XIVLauncherCN\addon\Hooks\dev"
          $intlPath = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $cnPath, $intlPath | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x dalamud.7z -o"$cnPath" -y
          Copy-Item "$cnPath\*" $intlPath -Recurse -Force
          Get-ChildItem "$cnPath\Dalamud.dll","$intlPath\Dalamud.dll" | Select-Object FullName,Length
      - name: Build
        run: |
          $ver = ('${{ github.ref_name }}' -split '-')[0]
          Write-Host "version: $ver"
          invoke-expression 'dotnet build --no-restore --configuration Beta --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver'
      - name: write version into jsons
        run: |
          $ver = ('${{ github.ref_name }}' -split '-')[0]
          Get-ChildItem ./VFXEditor/bin/Beta/*.json | Where-Object { $_.Name -ne 'packages.lock.json' } | ForEach-Object {
            Write-Host "updating $($_.Name)"
            $json = Get-Content -Raw $_.FullName | ConvertFrom-Json
            $json | Add-Member -Force -NotePropertyName AssemblyVersion -NotePropertyValue $ver
            $json | ConvertTo-Json -Depth 10 | Set-Content -Path $_.FullName -Encoding utf8
          }
      - name: Archive
        run: Compress-Archive -Path VFXEditor/bin/Beta/* -DestinationPath VFXEditorCN.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./VFXEditor/bin/Beta/*
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: VFXEditorCN ${{ github.ref_name }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./VFXEditorCN.zip
          asset_name: VFXEditorCN.zip
          asset_content_type: application/zip

      - name: Write out repo.json
        run: |
          $ver = ('${{ github.ref_name }}' -split '-')[0]
          $link = "https://github.com/cerantes/VFXEditor-l-wbcn/releases/download/$ver/VFXEditorCN.zip"
          $obj = [ordered]@{
            Author = 'ocealot, AtmoOmen(本地化)'
            Name = 'VFXEditorCN'
            Punchline = 'VFX 编辑器、查看器 (中文汉化版)'
            Description = '游戏内视觉效果、动画与音频编辑插件 | 图标来源: PAPACHIN | 本地化: AtmoOmen'
            Tags = @('VFX','AVFX')
            InternalName = 'VFXEditorCN'
            AssemblyVersion = $ver
            TestingAssemblyVersion = $ver
            RepoUrl = 'https://github.com/cerantes/VFXEditor-l-wbcn'
            ApplicableVersion = 'any'
            DalamudApiLevel = 15
            IsHide = 'False'
            IsTestingExclusive = 'False'
            DownloadCount = 1
            LastUpdate = 1618608322
            DownloadLinkInstall = $link
            DownloadLinkUpdate = $link
            DownloadLinkTesting = $link
            IconUrl = 'https://raw.githubusercontent.com/cerantes/VFXEditor-l-wbcn/main/assets/icon.png'
          }
          $content = ConvertTo-Json -InputObject @($obj) -Depth 5
          [System.IO.File]::WriteAllText((Resolve-Path ./repo.json), $content, (New-Object System.Text.UTF8Encoding($false)))

      - name: Commit repo.json
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git branch -f main ${{ github.sha }}
          git checkout main
          git add repo.json VFXEditor/Files/npc_files.json VFXEditor/Files/bnpc.json VFXEditor/Files/orchestrion.csv
          git commit -m "[CI] Updating repo.json, npc list and orchestrion list for ${{ github.ref_name }}" || true
          git push origin main